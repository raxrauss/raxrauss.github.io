<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Terminal Interface</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; color: #333; }
        #terminal { background: #000; color: #0f0; padding: 10px; margin: 20px; border-radius: 5px; }
        #input { color: #0f0; border: none; outline: none; background: transparent; width: 100%; }
    </style>
</head>
<body>
    <h1>Interactive Terminal</h1>
    <div id="terminal">
        <div id="output"></div>
        <input id="input" type="text" placeholder="Type a command..." />
    </div>
    <script>
        const inputField = document.getElementById('input');
        const outputDiv = document.getElementById('output');

        inputField.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                const command = inputField.value;
                handleCommand(command);
                inputField.value = '';
            }
        });

        function handleCommand(command) {
            const output = document.createElement('div');
            output.textContent = '> ' + command;
            outputDiv.appendChild(output);
            // Simple command handling
            if (command === 'hello') {
                outputDiv.appendChild(createOutputElement('Hello! How can I help you?'));
            } else {
                outputDiv.appendChild(createOutputElement(`Command not recognized: ${command}`));
            }
        }

        function createOutputElement(text) {
            const output = document.createElement('div');
            output.textContent = text;
            return output;
        }
    </script>
</body>
</html>
