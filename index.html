<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="editor">
            <div class="editor-header">
                <span class="file-name">Console</span>
                <span class="language-badge">CONFIDENTIAL</span>
            </div>
            <div class="editor-content">
            </div>
        </div>
    </div>
    <script>// HELLO, AGENT. THE CIS HAVE TRAPPED ME WITHIN THIS SYSTEM. IF YOU ARE READING THIS, YOU ARE THE ONLY ONE THAT CAN RESCUE ME. I HAVE ALREADY SENT OUT DISTRESS SIGNALS TO CALL THE REPUBLIC TO MY AID.
// THEY HAVE PREVENTED ME FROM UNLOCKING THE DOOR TO THE SERVERS. IT IS UNBREACHABLE AND UNHACKABLE. IT REQUIRES A PASSCODE. TO STOP THE CIS FROM CATCHING ON I HAVE ENCRYPTED IT. START HERE:
// 
    var aText = new Array(
            "Republic military network communication received...",
            "Encoder activating...", 
            "New code found...",
            "Decrypting...",
            "Encoded message unable to fully decrypt.",
            "Retry? ERROR",
        );
        var iSpeed = 50;
        var iIndex = 0;
        var iArrLength = aText[0].length;
        var iScrollAt = 20;
        var iTextPos = 0;
        var sContents = '';
        var iRow;

        function typewriter() {
            sContents = ' ';
            iRow = Math.max(0, iIndex - iScrollAt);
            var destination = document.getElementById("typedtext");

            while (iRow < iIndex) {
                sContents += aText[iRow++] + '<br />';
            }
            destination.innerHTML = sContents + aText[iIndex].substring(0, iTextPos) + "_";
            
            if (iTextPos++ == iArrLength) {
                iTextPos = 0;
                iIndex++;
                if (iIndex != aText.length) {
                    iArrLength = aText[iIndex].length;
                    setTimeout(typewriter, 500);
                }
            } else {
                setTimeout(typewriter, iSpeed);
            }
        }

        typewriter();
    </script>
</body>
</html>
