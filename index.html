<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Terminal Site</title>
  <style>
    body {
      margin: 0;
      background-color: black;
      color: #00ff00;
      font-family: Consolas, monospace;
    }

    .terminal {
      padding: 20px;
      height: 100vh;
      box-sizing: border-box;
      overflow-y: auto;
    }

    .line {
      display: flex;
    }

    .prompt {
      margin-right: 5px;
    }

    input {
      background: black;
      border: none;
      color: #00ff00;
      font-family: Consolas, monospace;
      outline: none;
      width: 100%;
    }
  </style>
</head>
<body>
  <div class="terminal" id="terminal">
    <div class="line">
      <span class="prompt">Console:$?>:</span>
      <input type="text" id="input" autofocus>
    </div>
  </div>

  <script>
    const input = document.getElementById("input");
    const terminal = document.getElementById("terminal");
    
    document.addEventListener("contextmenu", function(e) {
  e.preventDefault();
    });

    document.addEventListener("keydown", function(e) {
  if (
    e.key === "F12" ||
    (e.ctrlKey && e.shiftKey && e.key === "I") ||
    (e.ctrlKey && e.key === "U")
  ) {
    e.preventDefault();
  }
    });

    input.addEventListener("keydown", function(e) {
      if (e.key === "Enter") {
        const command = input.value.trim();
        addLine("C:\\> " + command);
        handleCommand(command);
        input.value = "";
      }
    });

    function addLine(text) {
      const div = document.createElement("div");
      div.textContent = text;
      terminal.insertBefore(div, terminal.lastElementChild);
      terminal.scrollTop = terminal.scrollHeight;
    }

    function handleCommand(cmd) {
      if (cmd === "aiwha") {
        addLine("SECURITY QUESTION 2: WHAT WAS ADMIRAL TRENCH'S FIRST FLAGSHIP NAMED?");
      } 
      else if (cmd === "invincible") {
        addLine("SECURITY QUESTION 3: WHAT WAS COUNT DOOKU'S FORMAL TITLE IN THE CIS?");
      } 
      else if (cmd === "head of state") {
        addLine("SECURITY CHECK PASSED. D");
      }
      else if (cmd === "login") {
        addLine("BREACH DETECTED. PASSWORD REQUIRED. SECURITY QUESTION 1: What were the flying creatures found on Kamino, commonly used as mounts?");
      } 
      else if (cmd === "clear") {
        clearTerminal();
      } 
      else {
        addLine("Command not found.");
      }
    }

    function clearTerminal() {
      const lines = document.querySelectorAll(".terminal div:not(.line)");
      lines.forEach(line => line.remove());
    }
  </script>
</body>
</html>
